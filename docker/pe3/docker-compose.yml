# ============================================================
# PE3 — Docker Compose para pruebas locales
# Kafka + Zookeeper + Productor + Spark Streaming
#
# Uso:
#   cd docker/pe3
#   docker compose up -d zookeeper kafka
#   # Esperar ~30s a que Kafka arranque
#   docker compose up -d producer
#   docker compose up spark-streaming
#
# Parar todo:
#   docker compose down -v
# ============================================================
version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pe3-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pe3-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pe3-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        echo 'Creando topic urban_sensors con 3 particiones...'
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic urban_sensors --partitions 3 --replication-factor 1
        echo 'Topic creado:'
        kafka-topics --bootstrap-server kafka:9092 --describe --topic urban_sensors

  producer:
    image: python:3.11-slim
    container_name: pe3-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ../../scripts/pe3:/app
    command:
      - bash
      - -c
      - |
        pip install -q kafka-python>=2.0.2 &&
        python producer_sensors.py --bootstrap-servers kafka:9092 --topic urban_sensors --count 200 --interval 0.5

  spark-streaming:
    image: apache/spark:3.5.3-python3
    container_name: pe3-spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: urban_sensors
      OUTPUT_MODE: console
    volumes:
      - ../../scripts/pe3:/app
    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      - /app/spark_streaming_job.py
